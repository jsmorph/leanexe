<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGPU Pages</title>
<style>
:root { --bg: #fafaf8; --fg: #1d2421; --muted: #5d6762; --accent: #2a5d8f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151918; --fg: #e3e8e5; --muted: #98a39d; --accent: #7fb2e5; }
}
:root[data-theme="dark"] { --bg: #151918; --fg: #e3e8e5; --muted: #98a39d; --accent: #7fb2e5; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
h1 { font-size: 24px; font-weight: 600; margin: 0 0 16px; }
a { color: var(--accent); }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>WebGPU Pages</h1>
<p><a href="kernels/">WebGPU kernel tests</a>: the cases of <code>tests/wgsl/Cases.lean</code> on
this browser's WebGPU, compared word for word with native Lean.</p>
<p><a href="gpt2/">GPT-2 in binary32</a>: GPT-2 124M with each kernel on WebGPU or in
<code>gpt32.wasm</code>, greedy or sampled with a seed.</p>
</main>
</body>
</html>
