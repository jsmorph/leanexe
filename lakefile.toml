name = "Project"
version = "0.1.0"
defaultTargets = ["LeanExe", "Project"]

[[require]]
name = "Verifier"
path = ".lake/packages/CodeLib/verifier"

# Lake loads requirements in reverse order, so CodeLib must follow Verifier.
[[require]]
name = "CodeLib"
git = "https://github.com/jsmorph/talos"
subDir = "codelib"
rev = "87e3aa5e8f6e6f3b3eb5e7e4c5aba43071002d47"

[[lean_lib]]
name = "LeanExe"

[[lean_lib]]
name = "Project"

# The program printer of the GPT-2 browser page (tests/gpt32/serve.py); not a default target.
[[lean_exe]]
name = "gpt32-lines"
root = "Project.Gpt32.Lines"
