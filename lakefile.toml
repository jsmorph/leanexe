name = "leanexe"
version = "0.1.0"
defaultTargets = ["LeanExe", "Examples", "Demos"]

[[require]]
name = "Verifier"
path = ".lake/packages/CodeLib/verifier"

# Lake loads requirements in reverse order, so CodeLib must follow Verifier.
[[require]]
name = "CodeLib"
git = "https://github.com/jsmorph/talos"
subDir = "codelib"
rev = "87e3aa5e8f6e6f3b3eb5e7e4c5aba43071002d47"

[[lean_lib]]
name = "LeanExe"

[[lean_lib]]
name = "Examples"

[[lean_lib]]
name = "Library"

[[lean_lib]]
name = "Demos"

[[lean_lib]]
name = "TestSupport"
srcDir = "tests"

# The verified compiler; not a default target.
[[lean_lib]]
name = "Verified"

# The program printer of the GPT-2 browser page (tests/web/serve.py); not a default target.
[[lean_exe]]
name = "gpt32-lines"
root = "Demos.Gpt32.Lines"

# The first-order Euler solver run natively, for comparison with its WebAssembly; not a default
# target.
[[lean_exe]]
name = "euler-native"
root = "Demos.Euler.Native"

# The check of the FIPS 202 transcription and the SHA-3 programs on the CAVP vectors
# (tests/TestSupport/Hashing/Sha3Vectors.lean); not a default target.
[[lean_exe]]
name = "sha3-vectors"
srcDir = "tests"
root = "TestSupport.Hashing.Sha3Vectors"

# The check of the CRC transcription and the CRC programs on the vectors of data/hashing/crc
# (tests/TestSupport/Hashing/CrcVectors.lean); not a default target.
[[lean_exe]]
name = "crc-vectors"
srcDir = "tests"
root = "TestSupport.Hashing.CrcVectors"

# The check of the SipHash transcription and programs on the reference and OpenSSL vectors
# (tests/TestSupport/Hashing/SipHashVectors.lean); not a default target.
[[lean_exe]]
name = "siphash-vectors"
srcDir = "tests"
root = "TestSupport.Hashing.SipHashVectors"

# The check of the XXH64 transcription and program on the xxHash sanity vectors
# (tests/TestSupport/Hashing/XxHash64Vectors.lean); not a default target.
[[lean_exe]]
name = "xxhash64-vectors"
srcDir = "tests"
root = "TestSupport.Hashing.XxHash64Vectors"

# The differential test of the Lean copy of Clight against CompCert's reference interpreter
# (tests/native/clight.sh); not a default target.
[[lean_exe]]
name = "clight-diff"
srcDir = "tests"
root = "TestSupport.Native.ClightDiff"

# The C text of the GCD modules for the translator's end-to-end test (tests/native/gcd.sh); not a
# default target.
[[lean_exe]]
name = "native-gcd"
srcDir = "tests"
root = "TestSupport.Native.GcdEmit"
