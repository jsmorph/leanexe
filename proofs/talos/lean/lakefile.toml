name = "Project"
version = "0.1.0"
defaultTargets = ["Project"]

[[require]]
name = "CodeLib"
git = "https://github.com/jsmorph/talos"
subDir = "codelib"
rev = "87e3aa5e8f6e6f3b3eb5e7e4c5aba43071002d47"

[[require]]
name = "leanexe"
path = "../../.."

[[lean_lib]]
name = "Project"

[[lean_exe]]
name = "gpt2-export-check"
root = "Project.Gpt2QuantizedCached.CheckExport"

[[lean_exe]]
name = "gpt2-activation-check"
root = "Project.Gpt2QuantizedCached.CheckActivations"

[[lean_exe]]
name = "gpt2-normalization-check"
root = "Project.Gpt2QuantizedCached.CheckNormalizations"

[[lean_exe]]
name = "gpt2-gelu-check"
root = "Project.Gpt2QuantizedCached.CheckGelu"

[[lean_exe]]
name = "gpt2-attention-check"
root = "Project.Gpt2QuantizedCached.CheckAttention"

[[lean_exe]]
name = "gpt2-projection-check"
root = "Project.Gpt2QuantizedCached.CheckProjections"
